<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coworking-space-site</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    
     <header>
			<nav>
				<ul>
					<li class="logo">
						WeBarelyWork
					</li>
					<li>
						<img src="./src/assets/pin.png" class="icon" alt="location">
					</li>
          <li class="align-right">
						<img src="./src/assets/burger.png" class="icon">
					</li>
				</ul>
			</nav>
		</header> 
		<main>
			<section>
				<h1>The best coworking spaces for lazy devs.</h1>
			</section>
			
			<section class="item">
				<img src="./src/assets/hygge.jpg" class="item-img" alt="A smart coworking space">
				<div class="caption">
					<p>Skiving in Scandinavia? Relax with a latte at Hygge Lounge.</p>
				</div>
			</section> 
			
			<section class="item">
				<img src="./src/assets/sky-garden.jpg" class="item-img" alt="A coworking space with plants">
				<div class="caption">
					<p>Bored in Barcelona? Take a siesta at the Sky Garden.</p>
				</div>
			</section> 
			
			<section class="item">
				<img src="./src/assets/generator.jpg" class="item-img" alt="A comfortable coworking space">
				<div class="caption">
					<p>Relaxing in Rio? Take some downtime at the Generator Hub.</p>
				</div>
			</section>
			
		</main>
  </body>
</html>
